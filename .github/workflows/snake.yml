name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#7F5AF0&color_dots=#ebedf0,#ddd6fe,#a78bfa,#8b5cf6,#6d28d9
            dist/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#161b22,#3b2a6b,#5b3fb0,#7F5AF0,#A78BFA

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
