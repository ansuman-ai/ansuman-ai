<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" role="img" aria-label="Ansu's real stats: chai high, sleep schedule not found" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#7F5AF0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
  <clipPath id="c"><rect width="820" height="330" rx="18"/></clipPath>
</defs>
<style>
  .t{font:700 22px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#E6EDF3}
  .s{font:400 13px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#8B949E}
  .l{font:600 15px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#C9D1D9}
  .v{font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#A78BFA}
  .fill{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.4s ease-out forwards}
  .d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}.d4{animation-delay:1.1s}
  @keyframes grow{to{transform:scaleX(1)}}
  .err{font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#F472B6;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .shake{transform-box:fill-box;transform-origin:center;animation:shake .5s ease-in-out infinite}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .steam{animation:steam 2.4s ease-in-out infinite;opacity:0}
  .st2{animation-delay:.8s}.st3{animation-delay:1.6s}
  @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.fill{transform:scaleX(1)}.steam{opacity:.6}}
</style>
<g clip-path="url(#c)">
  <rect width="820" height="330" fill="#0D1117"/>
  <rect x=".5" y=".5" width="819" height="329" rx="18" fill="none" stroke="#7F5AF0" stroke-opacity=".45"/>

  <!-- chai cup -->
  <g transform="translate(742 34)">
    <path class="steam" d="M10 8 q-5 -7 0 -14" stroke="#C9D1D9" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path class="steam st2" d="M20 8 q-5 -7 0 -14" stroke="#C9D1D9" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path class="steam st3" d="M30 8 q-5 -7 0 -14" stroke="#C9D1D9" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M2 12 h36 l-4 28 h-28 z" fill="#E9E3FF"/>
    <rect x="5" y="14" width="30" height="7" fill="#B07A4A"/>
    <path d="M38 18 q12 2 0 14" stroke="#E9E3FF" stroke-width="4" fill="none"/>
  </g>

  <text x="36" y="52" class="t">Ansu's real stats</text>
  <text x="36" y="74" class="s">the numbers GitHub doesn't show you</text>

  <!-- rows -->
  <text x="36" y="122" class="l">☕ Chai per commit</text>
  <rect x="300" y="108" width="400" height="14" rx="7" fill="#161B22"/>
  <rect x="300" y="108" width="392" height="14" rx="7" fill="url(#bar)" class="fill d1"/>
  <text x="784" y="121" class="v" text-anchor="end">98%</text>

  <text x="36" y="164" class="l">✅ Code working on first try</text>
  <rect x="300" y="150" width="400" height="14" rx="7" fill="#161B22"/>
  <rect x="300" y="150" width="10" height="14" rx="7" fill="url(#bar)" class="fill d2"/>
  <text x="784" y="163" class="v" text-anchor="end">2%</text>

  <text x="36" y="206" class="l">🐛 New bugs per bug fix</text>
  <rect x="300" y="192" width="400" height="14" rx="7" fill="#161B22"/>
  <rect x="300" y="192" width="300" height="14" rx="7" fill="url(#bar)" class="fill d3"/>
  <text x="784" y="205" class="v" text-anchor="end">3 per fix</text>

  <text x="36" y="248" class="l">🧠 AI tabs open right now</text>
  <rect x="300" y="234" width="400" height="14" rx="7" fill="#161B22"/>
  <rect x="300" y="234" width="400" height="14" rx="7" fill="url(#bar)" class="fill d4"/>
  <text x="784" y="247" class="v" text-anchor="end">too many</text>

  <text x="36" y="292" class="l">😴 Sleep schedule</text>
  <g class="shake"><text x="300" y="292" class="err">404 NOT FOUND</text></g>
  <text x="784" y="292" class="s" text-anchor="end">last seen: 1st sem</text>
</g>
</svg>
