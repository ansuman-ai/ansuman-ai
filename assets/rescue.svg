<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="820" height="320" role="img" aria-label="A hoverboard hero swoops in and catches someone falling from a rooftop">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07060F"/><stop offset="1" stop-color="#1A0F3A"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="c"><rect width="820" height="320" rx="18"/></clipPath>
  <mask id="m"><rect width="820" height="320" fill="#fff"/><circle cx="702" cy="56" r="20" fill="#000"/></mask>
</defs>
<style>
  .girl{animation:girl 7s linear infinite}
  @keyframes girl{
    0%{transform:translate(140px,112px);opacity:0}
    5%{opacity:1}
    24%{transform:translate(140px,112px);animation-timing-function:ease-in}
    40%{transform:translate(318px,250px);animation-timing-function:ease-in-out}
    62%{transform:translate(860px,40px);opacity:1}
    63%,100%{transform:translate(860px,40px);opacity:0}}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 7s linear infinite}
  @keyframes spin{0%,24%{transform:rotate(0)}32%{transform:rotate(-25deg)}40%,100%{transform:rotate(0)}}
  .hero{animation:hero 7s linear infinite}
  @keyframes hero{
    0%,22%{transform:translate(900px,170px);animation-timing-function:ease-out}
    40%{transform:translate(292px,258px);animation-timing-function:ease-in-out}
    62%{transform:translate(834px,48px)}
    63%,100%{transform:translate(900px,-120px)}}
  .flip{animation:flip 7s steps(1) infinite}
  @keyframes flip{0%,40%{transform:scaleX(1)}40.1%,100%{transform:scaleX(-1)}}
  .yell{opacity:0;animation:yell 7s infinite}
  @keyframes yell{0%,20%{opacity:0}24%,34%{opacity:1}38%,100%{opacity:0}}
  .heart{opacity:0;transform-box:fill-box;transform-origin:center;animation:heart 7s infinite}
  @keyframes heart{0%,39%{opacity:0;transform:scale(.2) translateY(0)}44%{opacity:1;transform:scale(1.3) translateY(-6px)}56%{opacity:1;transform:scale(1) translateY(-26px)}62%,100%{opacity:0;transform:scale(1) translateY(-40px)}}
  .win{animation:win 3s ease-in-out infinite}
  .w2{animation-delay:1s}.w3{animation-delay:2s}
  @keyframes win{0%,100%{opacity:.35}50%{opacity:1}}
  .cap{font:600 15px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#C9D1D9;letter-spacing:.5px}
  .say{font:800 16px 'Segoe UI',Ubuntu,Arial,sans-serif;fill:#F472B6}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.girl{transform:translate(318px,250px)}.hero{transform:translate(292px,258px)}.heart{opacity:1}}
</style>
<g clip-path="url(#c)">
  <rect width="820" height="320" fill="url(#sky)"/>
  <circle cx="690" cy="62" r="24" fill="#E9E3FF" mask="url(#m)" filter="url(#glow)"/>
  <g fill="#C9D1D9">
    <circle cx="80" cy="40" r="1.2"/><circle cx="240" cy="28" r="1"/><circle cx="420" cy="50" r="1.4"/><circle cx="560" cy="24" r="1"/><circle cx="770" cy="120" r="1.2"/><circle cx="330" cy="90" r="1"/><circle cx="480" cy="110" r="1"/>
  </g>
  <!-- skyline -->
  <g fill="#120A2A">
    <rect x="380" y="170" width="70" height="150"/><rect x="460" y="140" width="56" height="180"/><rect x="530" y="190" width="80" height="130"/><rect x="620" y="150" width="60" height="170"/><rect x="690" y="200" width="130" height="120"/>
  </g>
  <g fill="#22D3EE">
    <rect class="win" x="474" y="160" width="8" height="10"/><rect class="win w2" x="494" y="190" width="8" height="10"/><rect class="win w3" x="640" y="170" width="8" height="10"/><rect class="win" x="548" y="210" width="8" height="10"/><rect class="win w2" x="400" y="190" width="8" height="10"/><rect class="win w3" x="720" y="220" width="8" height="10"/>
  </g>
  <!-- rooftop building -->
  <rect x="40" y="112" width="140" height="210" fill="#1E1446"/>
  <rect x="40" y="108" width="140" height="6" fill="#7F5AF0"/>
  <g fill="#F472B6" opacity=".7"><rect x="62" y="140" width="10" height="12"/><rect x="96" y="170" width="10" height="12"/><rect x="130" y="140" width="10" height="12"/><rect x="62" y="200" width="10" height="12"/><rect x="130" y="230" width="10" height="12"/></g>

  <text class="say yell" x="160" y="58">AAAH!</text>

  <!-- falling person -->
  <g class="girl"><g class="spin">
    <line x1="-4" y1="-18" x2="-6" y2="0" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="-18" x2="6" y2="0" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round"/>
    <path d="M-11 -15 L11 -15 L6 -34 L-6 -34 Z" fill="#F472B6"/>
    <line x1="-6" y1="-32" x2="-14" y2="-44" stroke="#F5D0B5" stroke-width="3" stroke-linecap="round"/>
    <line x1="6" y1="-32" x2="14" y2="-44" stroke="#F5D0B5" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-42" r="8" fill="#F5D0B5"/>
    <path d="M-9 -42 Q-9 -53 0 -53 Q9 -53 9 -42 Q6 -48 0 -48 Q-6 -48 -9 -42 Z" fill="#3B2A6B"/>
    <circle cx="7" cy="-51" r="4" fill="#3B2A6B"/>
  </g></g>

  <!-- hero on hoverboard -->
  <g class="hero"><g class="flip">
    <ellipse cx="0" cy="10" rx="26" ry="5" fill="#22D3EE" opacity=".35" filter="url(#glow)"/>
    <path d="M6 -42 Q30 -34 30 -12 L8 -22 Z" fill="#F472B6"/>
    <line x1="-5" y1="-20" x2="-7" y2="0" stroke="#E6EDF3" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="5" y1="-20" x2="7" y2="0" stroke="#E6EDF3" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="-11" y="-44" width="22" height="26" rx="7" fill="#7F5AF0"/>
    <line x1="-9" y1="-38" x2="-20" y2="-46" stroke="#7F5AF0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-54" r="10" fill="#F5D0B5"/>
    <path d="M-10 -55 Q-10 -66 0 -66 Q10 -66 10 -55 Q4 -61 -2 -60 Q-7 -59 -10 -55 Z" fill="#1E1446"/>
    <rect x="-10" y="-58" width="20" height="6" rx="3" fill="#22D3EE" filter="url(#glow)"/>
    <rect x="-26" y="0" width="52" height="6" rx="3" fill="#22D3EE" filter="url(#glow)"/>
  </g></g>

  <text class="heart" x="296" y="196" font-size="26">💜</text>
  <text x="410" y="300" text-anchor="middle" class="cap">always there to catch you ✦</text>
</g>
</svg>
